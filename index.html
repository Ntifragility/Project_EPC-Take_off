<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPC Takeoff ⚡</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --s1: #161b22;
            --s2: #1c2128;
            --s3: #242a31;
            --b1: #30363d;
            --b2: #21262d;
            --tx: #e6edf3;
            --mu: #8b949e;
            --di: #484f58;
            --am: #f0a500;
            --ad: rgba(240, 165, 0, .11);
            --ab: rgba(240, 165, 0, .28);
            --gn: #3fb950;
            --rd: #f85149;
            --rdd: rgba(248, 81, 73, .1);
            --ui: 'Barlow Condensed', sans-serif;
            --mo: 'IBM Plex Mono', monospace;
        }

        body.light-theme {
            --bg: #f6f8fa;
            --s1: #ffffff;
            --s2: #f0f3f6;
            --s3: #e1e4e8;
            --b1: #d0d7de;
            --b2: #c0c7ce;
            --tx: #000000;
            --mu: #222222;
            --di: #444444;
            --am: #bf7300;
            --ad: rgba(191, 115, 0, .11);
            --ab: rgba(191, 115, 0, .28);
            --gn: #1a7f37;
            --rd: #d1242f;
            --rdd: rgba(209, 36, 47, .1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            font-size: 14px
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font-family: var(--ui);
            min-height: 100vh
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }

        ::-webkit-scrollbar-track {
            background: var(--bg)
        }

        ::-webkit-scrollbar-thumb {
            background: var(--b1);
            border-radius: 3px
        }

        /* Inputs */
        input,
        select,
        textarea {
            font-family: inherit;
            background: var(--s2);
            border: 1px solid var(--b1);
            border-radius: 6px;
            color: var(--tx);
            padding: 7px 11px;
            font-size: 13px;
            outline: none;
            transition: border-color .15s
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--am)
        }

        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            appearance: none;
        }

        /* Buttons */
        button {
            cursor: pointer;
            font-family: var(--ui);
            transition: opacity .15s
        }

        button:hover {
            opacity: .85
        }

        .btn-primary {
            background: var(--am);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .8px
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--b1);
            border-radius: 6px;
            color: var(--mu);
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .8px
        }

        .btn-ghost:hover {
            border-color: var(--mu);
            color: var(--tx);
            opacity: 1
        }

        .btn-danger {
            border-color: rgba(248, 81, 73, .4) !important;
            color: var(--rd) !important
        }

        .btn-danger:hover {
            border-color: var(--rd) !important;
            background: var(--rdd) !important
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--b2);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 11px;
            color: var(--mu);
            font-family: var(--ui)
        }

        .btn-green {
            background: var(--gn);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700
        }

        .btn-export {
            background: var(--gn);
            color: #000;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .8px;
            display: flex;
            align-items: center;
            gap: 5px
        }

        /* Layout */
        .header {
            background: var(--s1);
            border-bottom: 1px solid var(--b1);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100
        }

        .logo {
            color: var(--am);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 14px 0;
            white-space: nowrap
        }

        .logo span {
            color: var(--mu);
            font-weight: 400;
            font-size: 13px;
            margin-left: 10px;
            letter-spacing: 1px
        }

        .nav {
            display: flex
        }

        .nav-tab {
            background: none;
            border: none;
            color: var(--mu);
            padding: 18px 20px 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-bottom: 2px solid transparent;
            transition: all .15s
        }

        .nav-tab.active {
            color: var(--am);
            border-bottom-color: var(--am)
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .item-count {
            color: var(--mu);
            font-size: 12px;
            font-family: var(--mo);
            white-space: nowrap
        }

        .main {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto
        }

        /* Card */
        .card {
            background: var(--s1);
            border: 1px solid var(--b1);
            border-radius: 10px;
            padding: 20px
        }

        /* Fields */
        .field {
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .field-label {
            font-size: 11px;
            color: var(--mu);
            letter-spacing: 1.5px;
            font-weight: 700
        }

        .add-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap
        }

        /* Mode toggle */
        .mode-toggle {
            display: flex;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--b1)
        }

        .mode-btn {
            background: var(--s2);
            color: var(--mu);
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .8px
        }

        .mode-btn.active {
            background: var(--am);
            color: #000
        }

        /* Autocomplete */
        .ac-wrap {
            position: relative;
            flex: 1;
            min-width: 200px
        }

        .ac-input {
            width: 100%;
            font-family: var(--mo);
            font-size: 12px
        }

        .ac-dropdown {
            position: absolute;
            top: calc(100% + 2px);
            left: 0;
            right: 0;
            z-index: 300;
            background: var(--s2);
            border: 1px solid var(--b1);
            border-radius: 8px;
            max-height: 260px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
            display: none
        }

        .ac-option {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--b2)
        }

        .ac-option:last-child {
            border-bottom: none
        }

        .ac-option:hover {
            background: var(--ad)
        }

        .ac-opt-name {
            font-family: var(--mo);
            font-size: 11px;
            color: var(--am);
            font-weight: 500;
            margin-bottom: 2px
        }

        .ac-opt-sub {
            font-size: 10px;
            color: var(--mu)
        }

        .ac-empty {
            padding: 12px 14px;
            font-size: 12px;
            color: var(--di);
            text-align: center
        }

        /* Search bar */
        .search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px
        }

        .search-input {
            flex: 1
        }

        /* Package groups */
        .pkg-group {
            margin-bottom: 14px
        }

        .pkg-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--ad);
            border: 1px solid var(--ab);
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            user-select: none
        }

        .pkg-header.collapsed {
            border-radius: 8px
        }

        .pkg-header-left {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .pkg-chevron {
            color: var(--am);
            font-size: 10px;
            transition: transform .2s;
            display: inline-block
        }

        .pkg-name-lbl {
            color: var(--am);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.5px
        }

        .pkg-count-lbl {
            color: var(--am);
            font-size: 11px;
            font-family: var(--mo)
        }

        .pkg-body {
            border: 1px solid var(--b1);
            border-top: none;
            border-radius: 0 0 8px 8px;
            overflow-x: auto;
            overflow-y: hidden
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 1400px;
        }

        table,
        table input,
        table th,
        table td,
        .td-n,
        .td-d,
        .td-q,
        .td-u,
        .edit-input-mono {
            font-family: "Aptos Narrow", sans-serif !important;
        }

        col.c-n {
            width: 40px
        }

        col.c-mat {
            width: 46px
        }

        col.c-plano {
            width: 170px
        }

        col.c-rev {
            width: 30px
        }

        col.c-t-unico {
            width: 140px
        }

        col.c-t-plano {
            width: 50px
        }

        col.c-det {
            width: 50px
        }

        col.c-d {
            width: auto
        }

        col.c-q {
            width: 88px
        }

        col.c-mo {
            width: 80px
        }

        col.c-u {
            width: 76px
        }

        col.c-no {
            width: 120px
        }

        col.c-a {
            width: 82px
        }

        thead tr {
            background: var(--s2);
            border-bottom: 1px solid var(--b1)
        }

        th {
            padding: 8px 10px;
            text-align: center !important;
            vertical-align: middle !important;
            color: var(--mu);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px
        }

        th:first-child {
            text-align: center
        }

        .tr-row {
            transition: background .1s
        }

        .tr-row:hover td {
            background: var(--s2)
        }

        .tr-edit td {
            background: var(--ad) !important
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--b2);
            vertical-align: middle;
            text-align: center;
        }

        tr:last-child td {
            border-bottom: none
        }

        .td-n {
            text-align: center;
            color: var(--di);
            font-size: 11px;
            font-family: var(--mo)
        }

        .td-d {
            font-family: var(--mo);
            font-size: 11px;
            word-break: break-word
        }

        .td-q {
            font-family: var(--mo);
            font-size: 13px;
            color: var(--am);
            font-weight: 500
        }

        .td-u {
            font-size: 11px;
            color: var(--mu);
            font-family: var(--mo)
        }

        .td-no {
            font-size: 11px;
            color: var(--mu);
            font-style: italic
        }

        .td-no.has-notes {
            color: var(--tx);
            font-style: normal
        }

        .td-a {
            text-align: center
        }

        .act-row {
            display: flex;
            gap: 4px;
            justify-content: center
        }

        .edit-input {
            width: 100%;
            padding: 4px 7px;
            font-size: 12px
        }

        .edit-input-mono {
            font-family: var(--mo)
        }

        /* Empty state */
        .empty {
            text-align: center;
            padding: 56px 0;
            color: var(--di)
        }

        .empty-icon {
            font-size: 28px;
            margin-bottom: 10px
        }

        .empty-title {
            font-size: 15px;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: var(--mu)
        }

        .empty-sub {
            font-size: 12px
        }

        /* View headers */
        .view-hd {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 12px
        }

        .view-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px
        }

        .view-sub {
            color: var(--mu);
            font-size: 13px;
            margin-top: 4px
        }

        /* Rule cards */
        .rule-card {
            background: var(--s1);
            border: 1px solid var(--b1);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px
        }

        .rule-card-row {
            display: flex;
            align-items: flex-start;
            gap: 12px
        }

        .rule-trigger {
            font-family: var(--mo);
            font-size: 12px;
            color: var(--am);
            font-weight: 500;
            margin-bottom: 10px
        }

        .rule-subitems {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1
        }

        .rule-sub {
            display: flex;
            gap: 10px;
            font-size: 11px;
            font-family: var(--mo);
            color: var(--mu);
            padding-left: 14px;
            border-left: 2px solid var(--b1)
        }

        .rule-sub-n {
            color: var(--di);
            min-width: 18px
        }

        .rule-sub-d {
            flex: 1
        }

        .rule-sub-q {
            color: var(--am)
        }

        .rule-card-acts {
            display: flex;
            gap: 8px;
            flex-shrink: 0
        }

        /* Rule editor */
        .rule-editor {
            background: var(--s2);
            border: 1px solid var(--ab);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px
        }

        .rule-editor-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--am);
            margin-bottom: 16px
        }

        .sub-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px
        }

        .sub-n {
            color: var(--di);
            font-size: 12px;
            font-family: var(--mo);
            min-width: 20px
        }

        .sub-del {
            background: none;
            border: none;
            color: var(--di);
            font-size: 15px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1
        }

        .sub-del:hover {
            color: var(--rd)
        }

        .rule-editor-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--b1)
        }

        /* Package CRUD */
        .pkg-add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            max-width: 600px
        }

        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 600px
        }

        .pkg-item {
            background: var(--s1);
            border: 1px solid var(--b1);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center
        }

        .pkg-item-icon {
            color: var(--am);
            font-size: 13px
        }

        .pkg-item-name {
            flex: 1;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: .5px
        }

        .pkg-item-acts {
            display: flex;
            gap: 8px
        }

        .pkg-edit-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .72);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .modal {
            background: var(--s1);
            border: 1px solid var(--b1);
            border-radius: 12px;
            width: 100%;
            max-width: 640px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5)
        }

        .modal-hd {
            padding: 18px 22px;
            border-bottom: 1px solid var(--b1);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .modal-hd-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--mu);
            font-size: 18px;
            line-height: 1;
            padding: 0
        }

        .modal-body {
            padding: 22px;
            overflow-y: auto;
            flex: 1
        }

        .modal-ft {
            padding: 14px 22px;
            border-top: 1px solid var(--b1);
            display: flex;
            gap: 10px;
            justify-content: flex-end
        }

        .mb-16 {
            margin-bottom: 16px
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--s2);
            border: 1px solid var(--b1);
            border-left: 3px solid var(--gn);
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 13px;
            color: var(--tx);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
            animation: tsIn .2s ease-out;
            pointer-events: none
        }

        .toast.warn {
            border-left-color: var(--am)
        }

        @keyframes tsIn {
            from {
                transform: translateY(16px);
                opacity: 0
            }
        }

        /* Confirm badge */
        .confirm-badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--rdd);
            border: 1px solid var(--rd);
            border-radius: 4px;
            font-size: 11px;
            color: var(--rd);
            letter-spacing: .5px
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div style="display:flex;align-items:center;gap:28px">
            <div class="logo">⚡ EPC TAKEOFF <span>METRADO ELÉCTRICO</span></div>
            <nav class="nav">
                <button class="nav-tab active" id="nav-takeoff" onclick="APP.setTab('takeoff')">METRADO</button>
                <button class="nav-tab" id="nav-rules" onclick="APP.setTab('rules')">REGLAS</button>
                <button class="nav-tab" id="nav-packages" onclick="APP.setTab('packages')">PARTIDAS</button>
            </nav>
        </div>
        <div class="header-right">
            <button class="btn-icon" style="font-size:16px;padding:3px 8px;border-color:transparent"
                onclick="APP.toggleTheme()" id="theme-btn" title="Toggle Theme">☀️</button>
            <button class="btn-ghost" style="padding:4px 10px;font-size:11px" onclick="APP.clearCache()"
                title="Restablecer Datos">🗑️ RESTABLECER</button>
            <span class="item-count" id="item-count">0 ítems</span>
            <button class="btn-export" onclick="APP.exportCSV()">↓ EXPORTAR CSV</button>
        </div>
    </div>

    <!-- Main -->
    <div class="main" id="main-content"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" style="display:none" onclick="APP.closeModalOnBackdrop(event)">
        <div class="modal" id="modal-box">
            <div class="modal-hd">
                <span class="modal-hd-title" id="modal-title">REGLA</span>
                <button class="modal-close" onclick="APP.closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-ft">
                <button class="btn-ghost" onclick="APP.closeModal()">CANCELAR</button>
                <button class="btn-primary" id="modal-save" onclick="APP.saveRule()">GUARDAR REGLA</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none"></div>

    <script>
        // ── uid
        function uid() { return Math.random().toString(36).slice(2, 10) }

        // ── Seed data
        const SEED_RULES = [
            {
                id: 'r1', trigger: 'CABLE DESNUDO 4/0 AWG', subitems: [
                    { id: 's1', desc: 'CABLE DESNUDO 4/0 AWG', qty: 1, unit: 'ML' },
                    { id: 's2', desc: 'CINTA AMARILLA', qty: 1, unit: 'ML' },
                    { id: 's3', desc: 'TIERRA DE CULTIVO', qty: 1, unit: 'M3' },
                ]
            },
            {
                id: 'r2', trigger: 'CABLE DESNUDO 2/0 AWG', subitems: [
                    { id: 's4', desc: 'CABLE DESNUDO 2/0 AWG', qty: 1, unit: 'ML' },
                    { id: 's5', desc: 'TERMINAL A COMPRESION UN OJAL 1/2 PARA CABLE 2/0 YAV', qty: 1, unit: 'UND' },
                    { id: 's6', desc: 'PERNO 1/2"X1 1/2" DE ACERO GALVANIZADO, CON TUERCA, DOBLE ARANDELA PLANA Y UNA DE PRESIÓN', qty: 1, unit: 'UND' },
                ]
            },
            {
                id: 'r3', trigger: 'POZO CON CAJA REGISTRO', subitems: [
                    { id: 's7', desc: 'POZO CON CAJA REGISTRO', qty: 1, unit: 'UND' },
                    { id: 's8', desc: 'CEMENTO GEM (11.3 kg x bls)', qty: 1, unit: 'BLS' },
                    { id: 's9', desc: 'CAJA REGISTRO 400 x 400 x 300 mm', qty: 1, unit: 'UND' },

        };

        APP.applyTrigger = function (ruleId) {
            const rule = S.rules.find(r => r.id === ruleId);
            if (!rule) return;

            const tagPlano = window.prompt(`Ingresa el TAG PLANO para la regla seleccionada: ${rule.trigger}\n(Dejar en blanco si no aplica)`) || '';
            const detalle = window.prompt(`Ingresa el DETALLE para la regla seleccionada: ${rule.trigger}\n(Dejar en blanco si no aplica)`) || '';

            const pkgId = S.selPkg || S.packages[0]?.id || null;
            const newItems = rule.subitems.map((s, idx) => ({
                id: uid(), pkgId,
                desc: s.desc, qty: s.qty, unit: s.unit, notes: '', ruleId: rule.id,
                material: idx === 0 ? 'P' : 'C',
                plano: (S.customPlano || '').toUpperCase(),
                rev: (S.customRev || '').toUpperCase(),
                tagUnico: '',
                tagPlano: tagPlano,
                detalle: detalle,
                metradoOt: ''
            }));
            S.items.push(...newItems);
            S.triggerQuery = '';
            saveData();
            APP.render();
            APP.toast(`${rule.subitems.length} ítems agregados`);
        };

        APP.setCustomField = function (f, v) {
            if (f === 'desc') S.customDesc = v;
            else if (f === 'qty') S.customQty = v;
            else if (f === 'unit') S.customUnit = v;
            else if (f === 'plano') S.customPlano = v;
            else if (f === 'rev') S.customRev = v;
        };

        APP.addCustomItem = function () {
            const desc = (document.getElementById('custom-desc')?.value || S.customDesc).trim();
            if (!desc) { APP.toast('Ingresa una descripción', 'warn'); return; }
            const qty = +(document.getElementById('custom-qty')?.value || S.customQty);
            const unit = (document.getElementById('custom-unit')?.value || S.customUnit).toUpperCase() || 'UND';
            const pkgId = S.selPkg || S.packages[0]?.id || null;
            S.items.push({
                id: uid(), pkgId, desc, qty, unit, notes: '',
                material: 'P',
                plano: (S.customPlano || '').toUpperCase(),
                rev: (S.customRev || '').toUpperCase(),
                tagUnico: '', tagPlano: '', detalle: '', metradoOt: ''
            });
            S.customDesc = ''; S.customQty = 1; S.customUnit = 'UND';
            saveData();
            APP.render();
            APP.toast('Ítem agregado');
        };

        APP.setSearch = function (v) {
            S.searchQuery = v;
            const container = document.getElementById('table-container');
            if (container) container.innerHTML = APP.htmlTableGroups();
            // also update count in search bar
            const countEl = document.querySelector('.search-bar .item-count');
            if (countEl) countEl.textContent = APP.filteredItems().length + ' / ' + S.items.length + ' ítems';
        };
        APP.clearSearch = function () {
            S.searchQuery = '';
            APP.render();
        };

        APP.togglePkg = function (pkgId) {
            if (S.collapsedPkgs.has(pkgId)) S.collapsedPkgs.delete(pkgId);
            else S.collapsedPkgs.add(pkgId);
            const container = document.getElementById('table-container');
            if (container) container.innerHTML = APP.htmlTableGroups();
        };

        APP.editItem = function (id) {
            S.editingItem = id;
            const container = document.getElementById('table-container');
            if (container) container.innerHTML = APP.htmlTableGroups();
            // Focus qty input
            setTimeout(() => { const el = document.getElementById('edit-qty'); if (el) { el.select(); } }, 50);
        };

        APP.saveItem = function (id) {
            const qty = +(document.getElementById('edit-qty')?.value || 0);
            const unit = (document.getElementById('edit-unit')?.value || '').toUpperCase();
            const notes = document.getElementById('edit-notes')?.value || '';
            const material = (document.getElementById('edit-mat')?.value || '').toUpperCase();
            const plano = (document.getElementById('edit-plano')?.value || '').toUpperCase();
            const rev = (document.getElementById('edit-rev')?.value || '').toUpperCase();
            const tagUnico = document.getElementById('edit-t-unico')?.value || '';
            const tagPlano = document.getElementById('edit-t-plano')?.value || '';
            const detalle = document.getElementById('edit-det')?.value || '';
            const metradoOt = document.getElementById('edit-mot')?.value || '';

            const it = S.items.find(i => i.id === id);
            if (it) { Object.assign(it, { qty, unit, notes, material, plano, rev, tagUnico, tagPlano, detalle, metradoOt }); }
            S.editingItem = null;
            saveData();
            const container = document.getElementById('table-container');
            if (container) container.innerHTML = APP.htmlTableGroups();
            APP.toast('Ítem actualizado');
        };

        APP.cancelEdit = function () {
            S.editingItem = null;
            const container = document.getElementById('table-container');
            if (container) container.innerHTML = APP.htmlTableGroups();
        };

        APP.deleteItem = function (id) {
            if (!confirm('¿Eliminar este ítem?')) return;
            S.items = S.items.filter(it => it.id !== id);
            saveData();
            const container = document.getElementById('table-container');
            if (container) container.innerHTML = APP.htmlTableGroups();
            document.getElementById('item-count').textContent = S.items.length + ' ítem' + (S.items.length !== 1 ? 's' : '');
            APP.toast('Ítem eliminado');
        };

        // ── ACTIONS: Rules (modal)
        APP.openNewRule = function () {
            S.editingRule = { id: uid(), trigger: '', subitems: [{ id: uid(), desc: '', qty: 1, unit: 'UND' }] };
            S.editingRuleIsNew = true;
            document.getElementById('modal-title').textContent = 'NUEVA REGLA';
            APP.renderRuleModal();
            document.getElementById('modal-overlay').style.display = 'flex';
            setTimeout(() => { const el = document.getElementById('modal-trigger'); if (el) el.focus(); }, 100);
        };

        APP.openEditRule = function (id) {
            const rule = S.rules.find(r => r.id === id);
            if (!rule) return;
            S.editingRule = JSON.parse(JSON.stringify(rule));
            S.editingRuleIsNew = false;
            document.getElementById('modal-title').textContent = 'EDITAR REGLA';
            APP.renderRuleModal();
            document.getElementById('modal-overlay').style.display = 'flex';
        };

        APP.renderRuleModal = function () {
            const r = S.editingRule;
            document.getElementById('modal-body').innerHTML = `
    <div class="mb-16">
      <div class="field-label" style="margin-bottom:6px">DISPARADOR</div>
      <input id="modal-trigger" type="text" value="${esc(r.trigger)}"
        style="width:100%;font-family:var(--mo);font-size:12px"
        placeholder="Ej: CABLE DESNUDO 4/0 AWG"
        oninput="S.editingRule.trigger=this.value.toUpperCase();this.value=S.editingRule.trigger">
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="field-label">ÍTEMS ASOCIADOS</div>
        <button class="btn-ghost btn-sm" onclick="APP.addModalSubitem()">+ ÍTEM</button>
      </div>
      <div id="modal-subitems">
        ${r.subitems.length === 0
                    ? `<div style="color:var(--mu);font-size:12px;text-align:center;padding:14px 0">Sin ítems — agrega al menos uno</div>`
                    : r.subitems.map((s, i) => `
          <div class="sub-row" id="sub-row-${s.id}">
            <span class="sub-n">${i + 1}</span>
            <input type="text" value="${esc(s.desc)}" style="flex:3;font-family:var(--mo);font-size:11px"
              placeholder="Descripción..." oninput="APP.updateSubitem('${s.id}','desc',this.value)">
            <input type="number" min="0" value="${s.qty}" style="width:70px"
              oninput="APP.updateSubitem('${s.id}','qty',+this.value)">
            <input type="text" value="${esc(s.unit)}" style="width:70px;text-transform:uppercase"
              oninput="APP.updateSubitem('${s.id}','unit',this.value.toUpperCase())">
            <button class="sub-del" onclick="APP.removeSubitem('${s.id}')" title="Eliminar">✕</button>
          </div>`).join('')
                }
      </div>
    </div>`;
        };

        APP.addModalSubitem = function () {
            if (!S.editingRule) return;
            S.editingRule.subitems.push({ id: uid(), desc: '', qty: 1, unit: 'UND' });
            APP.renderRuleModal();
            // Focus last desc input
            setTimeout(() => {
                const rows = document.querySelectorAll('#modal-subitems .sub-row');
                const last = rows[rows.length - 1];
                if (last) last.querySelector('input')?.focus();
            }, 50);
        };

        APP.updateSubitem = function (id, field, value) {
            const s = S.editingRule?.subitems.find(x => x.id === id);
            if (s) s[field] = value;
        };

        APP.removeSubitem = function (id) {
            if (!S.editingRule) return;
            S.editingRule.subitems = S.editingRule.subitems.filter(s => s.id !== id);
            APP.renderRuleModal();
        };

        APP.saveRule = function () {
            const r = S.editingRule;
            if (!r) return;
            // Collect current input values
            const triggerInput = document.getElementById('modal-trigger');
            if (triggerInput) r.trigger = triggerInput.value.toUpperCase();
            if (!r.trigger.trim()) { APP.toast('El disparador no puede estar vacío', 'warn'); return; }
            if (r.subitems.length === 0) { APP.toast('Agrega al menos un ítem', 'warn'); return; }
            // Collect subitem inputs
            r.subitems.forEach(s => {
                const row = document.getElementById('sub-row-' + s.id);
                if (row) {
                    const inputs = row.querySelectorAll('input');
                    s.desc = inputs[0]?.value || s.desc;
                    s.qty = +(inputs[1]?.value || s.qty);
                    s.unit = (inputs[2]?.value || s.unit).toUpperCase();
                }
            });
            if (S.editingRuleIsNew) S.rules.push(r);
            else { const i = S.rules.findIndex(x => x.id === r.id); if (i >= 0) S.rules[i] = r; }
            saveData();
            APP.closeModal();
            APP.render();
            APP.toast(S.editingRuleIsNew ? 'Regla creada' : 'Regla actualizada');
        };

        APP.deleteRule = function (id) {
            if (!confirm('¿Eliminar esta regla?')) return;
            S.rules = S.rules.filter(r => r.id !== id);
            saveData();
            APP.render();
            APP.toast('Regla eliminada');
        };

        APP.closeModal = function () {
            document.getElementById('modal-overlay').style.display = 'none';
            S.editingRule = null;
        };
        APP.closeModalOnBackdrop = function (e) {
            if (e.target === document.getElementById('modal-overlay')) APP.closeModal();
        };

        // ── ACTIONS: Packages
        APP.addPackage = function () {
            const inp = document.getElementById('new-pkg-input');
            const name = (inp?.value || '').trim().toUpperCase();
            if (!name) { APP.toast('Ingresa un nombre', 'warn'); return; }
            S.packages.push({ id: uid(), name });
            if (!S.selPkg) S.selPkg = S.packages[0].id;
            saveData();
            APP.render();
            APP.toast('Partida creada');
        };

        APP.editPkg = function (id) {
            const pkg = S.packages.find(p => p.id === id);
            if (!pkg) return;
            S.editingPkg = id;
            S.editingPkgName = pkg.name;
            APP.render();
            setTimeout(() => {
                const el = document.getElementById('edit-pkg-input');
                if (el) { el.focus(); el.select(); }
            }, 50);
        };

        APP.savePkg = function (id) {
            const inp = document.getElementById('edit-pkg-input');
            const name = (inp?.value || S.editingPkgName).trim().toUpperCase();
            if (!name) return;
            const pkg = S.packages.find(p => p.id === id);
            if (pkg) pkg.name = name;
            S.editingPkg = null;
            saveData();
            APP.render();
            APP.toast('Partida actualizada');
        };

        APP.cancelEditPkg = function () {
            S.editingPkg = null;
            APP.render();
        };

        APP.deletePkg = function (id) {
            const pkg = S.packages.find(p => p.id === id);
            const itemsInPkg = S.items.filter(it => it.pkgId === id).length;
            const msg = `¿Eliminar la partida "${pkg?.name}"?` + (itemsInPkg > 0 ? `\n\nEsto también eliminará ${itemsInPkg} ítem${itemsInPkg !== 1 ? 's' : ''} del metrado.` : '');
            if (!confirm(msg)) return;
            S.packages = S.packages.filter(p => p.id !== id);
            S.items = S.items.filter(it => it.pkgId !== id);
            if (S.selPkg === id) S.selPkg = S.packages[0]?.id || null;
            saveData();
            APP.render();
            APP.toast('Partida eliminada');
        };

        // ── CSV EXPORT
        APP.exportCSV = function () {
            if (S.items.length === 0) { APP.toast('Sin ítems para exportar', 'warn'); return; }
            const cols = ['PARTIDA', 'MATERIAL', 'PLANO', 'REV', 'TAG UNICO', 'TAG EN PLANO', 'DETALLE', 'DESCRIPCION', 'CANTIDAD', 'METRADO OT', 'UNIDAD', 'NOTAS'];
            const rows = S.items.map(it => {
                const pkg = S.packages.find(p => p.id === it.pkgId)?.name || 'SIN PARTIDA';
                return [pkg, it.material || '', it.plano || '', it.rev || '', it.tagUnico || '', it.tagPlano || '', it.detalle || '', it.desc, it.qty, it.metradoOt || '', it.unit, it.notes || ''];
            });
            const csv = [cols, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `metrado_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            APP.toast(`${S.items.length} ítems exportados`);
        };

        // ── TOAST
        let toastTimer = null;
        APP.toast = function (msg, type) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.className = 'toast' + (type === 'warn' ? ' warn' : '');
            el.style.display = 'block';
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2800);
        };

        // ── UTILITY
        function esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ── CACHE
        APP.clearCache = function () {
            if (confirm('¿Eliminar todos los datos locales y restablecer a los valores por defecto? Esto borrará el metrado, reglas y partidas creadas.')) {
                localStorage.removeItem('epc-rules');
                localStorage.removeItem('epc-packages');
                localStorage.removeItem('epc-items');
                location.reload();
            }
        };

        // ── THEME
        APP.toggleTheme = function () {
            const isLight = document.body.classList.toggle('light-theme');
            localStorage.setItem('epc-theme', isLight ? 'light' : 'dark');
            const tb = document.getElementById('theme-btn');
            if (tb) tb.textContent = isLight ? '🌙' : '☀️';
        };

        // ── INIT
        if (localStorage.getItem('epc-theme') === 'light') {
            document.body.classList.add('light-theme');
            const tb = document.getElementById('theme-btn');
            if (tb) tb.textContent = '🌙';
        }
        loadData();
        APP.render();

        // Keyboard shortcut: Escape closes modal
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && document.getElementById('modal-overlay').style.display !== 'none') APP.closeModal();
        });
    </script>
</body>

</html>
