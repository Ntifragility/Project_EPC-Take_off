    .modal-close {
      color: var(--mu);
      background: 0 0;
      border: none;
      padding: 0;
      font-size: 18px;
      line-height: 1
    }

    .modal-body {
      flex: 1;
      padding: 22px;
      overflow-y: auto
    }

    .modal-ft {
      border-top: 1px solid var(--b1);
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 22px;
      display: flex
    }

    .mb-16 {
      margin-bottom: 16px
    }

    .toast {
      z-index: 1000;
      background: var(--s2);
      border: 1px solid var(--b1);
      border-left: 3px solid var(--gn);
      color: var(--tx);
      pointer-events: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 13px;
      animation: .2s ease-out tsIn;
      position: fixed;
      bottom: 20px;
      right: 20px;
      box-shadow: 0 8px 24px #0006
    }

    .toast.warn {
      border-left-color: var(--am)
    }

    @keyframes tsIn {
      0% {
        opacity: 0;
        transform: translateY(16px)
      }
    }

    .confirm-badge {
      background: var(--rdd);
      border: 1px solid var(--rd);
      color: var(--rd);
      letter-spacing: .5px;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 11px;
      display: inline-block
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div style="display:flex;align-items:center;gap:28px">
      <div class="logo">⚡ EPC TAKEOFF <span id="active-section-name">PAT</span></div>
      <div class="section-switch" aria-label="Especialidad activa">
        <button data-section="pat" onclick="APP.setSection('pat')">PAT</button>
        <button data-section="canalizado" onclick="APP.setSection('canalizado')">CANALIZADO</button>
      </div>
      <nav class="nav">
        <button class="nav-tab" id="nav-takeoff" onclick="APP.setTab('takeoff')">METRADO</button>
        <button class="nav-tab" id="nav-rules" onclick="APP.setTab('rules')">REGLAS</button>
        <button class="nav-tab" id="nav-packages" onclick="APP.setTab('packages')">PARTIDAS</button>
        <button class="nav-tab" style="color:var(--am)" onclick="APP.showMatSummaryModal()">RESUMEN MAT
          P</button>
      </nav>
    </div>
    <div class="header-right">
      <button class="btn-icon" style="font-size:16px;padding:3px 8px;border-color:transparent"
        onclick="APP.toggleTheme()" id="theme-btn" title="Toggle Theme">☀️</button>
      <button class="btn-ghost" style="padding:4px 10px;font-size:11px" onclick="APP.clearCache()"
        title="Restablecer Datos">🗑️ RESTABLECER</button>
      <button class="btn-primary"
        style="padding:4px 10px;font-size:11px;background:#388bfd;color:#fff;border:1px solid #388bfd"
        onclick="APP.syncToDatabase()" title="Depositar/Añadir los datos de la pantalla a la base de datos">☁️
        GUARDAR EN BD</button>
      <span class="item-count" id="item-count">0 ítems</span>
      <button class="btn-export" onclick="APP.exportCSV()">↓ EXPORTAR CSV</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main" id="main-content"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none" onclick="APP.closeModalOnBackdrop(event)">
    <div class="modal" id="modal-box">
      <div class="modal-hd">
        <span class="modal-hd-title" id="modal-title">REGLA</span>
        <button class="modal-close" onclick="APP.closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-ft">
        <button class="btn-ghost" onclick="APP.closeModal()">CANCELAR</button>
        <button class="btn-primary" id="modal-save" onclick="APP.saveRule()">GUARDAR REGLA</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none"></div>

</body>

</html>
